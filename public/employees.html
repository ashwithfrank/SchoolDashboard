<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Employees — School Staff Management Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex; align-items:center;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <h1 id="page-title">Employees</h1>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <form id="search-form" style="display:flex; gap:8px; flex:1;">
          <input type="search" id="search-input" placeholder="Search by name, code, or contact number" style="flex:1; max-width:320px; padding:9px 12px; border:1px solid var(--color-border); border-radius:6px;" />
          <select id="type-filter" style="padding:9px 11px; border:1px solid var(--color-border); border-radius:6px;">
            <option value="">All types</option>
            <option value="teaching">Teaching</option>
            <option value="office">Office</option>
            <option value="driver">Driver</option>
            <option value="other">Other</option>
          </select>
          <select id="status-filter" style="padding:9px 11px; border:1px solid var(--color-border); border-radius:6px;">
            <option value="">Any status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
          <button type="submit" class="btn btn-secondary">Search</button>
        </form>
        <a href="employee-form.html" class="btn" id="add-employee-link" style="display:none;">+ Add Employee</a>
      </div>

      <div class="card">
        <table>
          <thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Designation</th><th>Contact</th><th>Status</th></tr></thead>
          <tbody id="employees-tbody"><tr><td colspan="6" class="loading-row">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/employees.js"></script>
</body>
</html>
