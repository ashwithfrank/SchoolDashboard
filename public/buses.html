<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buses — School Staff Management Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex; align-items:center;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <h1 id="page-title">Buses</h1>
      </div>
    </header>

    <main class="content">
      <div class="empty-state card">
        <div class="empty-icon">🚌</div>
        <h2>Bus fleet management is coming in Phase 3</h2>
        <p>Bus number, driver, insurance/FC expiry, and each bus's assigned students — with each student's own
          location, distance, and bus fee, per the confirmed per-student transport design.</p>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
