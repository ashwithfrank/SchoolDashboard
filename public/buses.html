<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buses — School Staff Management Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex; align-items:center;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <h1 id="page-title">Buses</h1>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <div></div>
        <a href="bus-form.html" class="btn" id="add-bus-link" style="display:none;">+ Add Bus</a>
      </div>

      <div class="card">
        <table>
          <thead><tr><th>Bus Number</th><th>Driver</th><th>Insurance</th><th>FC</th><th>Capacity</th><th>Status</th></tr></thead>
          <tbody id="buses-tbody"><tr><td colspan="6" class="loading-row">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/buses.js"></script>
</body>
</html>
