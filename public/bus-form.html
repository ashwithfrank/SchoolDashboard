<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add/Edit Bus — School Staff Management Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex; align-items:center;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <h1 id="page-title">Add Bus</h1>
      </div>
    </header>

    <main class="content">
      <div class="breadcrumb"><a href="buses.html">Buses</a><span class="sep">/</span><span class="current" id="form-heading">Add Bus</span></div>

      <div id="form-area">
        <div class="card">
          <div class="form-error" id="form-error"></div>

          <form id="bus-form" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="bus_number">Bus number *</label>
                <input type="text" id="bus_number" required />
              </div>
              <div class="field">
                <label for="driver_id">Driver</label>
                <select id="driver_id"></select>
              </div>
              <div class="field">
                <label for="insurance_expiry_date">Insurance expiry</label>
                <input type="date" id="insurance_expiry_date" />
              </div>
              <div class="field">
                <label for="fc_expiry_date">FC (Fitness Certificate) expiry</label>
                <input type="date" id="fc_expiry_date" />
              </div>
              <div class="field">
                <label for="capacity">Capacity</label>
                <input type="number" id="capacity" min="1" />
              </div>
              <div class="field" id="active-field-wrap" style="display:none; align-self:end;">
                <label style="display:flex; align-items:center; gap:8px; margin-bottom:0;">
                  <input type="checkbox" id="is_active" style="width:auto;" />
                  Active
                </label>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn" id="submit-btn">Add Bus</button>
              <a href="buses.html" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/bus-form.js"></script>
</body>
</html>
