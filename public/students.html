<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students — School Staff Management Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex; align-items:center;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <h1 id="page-title">Students</h1>
      </div>
    </header>

    <main class="content">
      <form id="search-form" class="search-bar">
        <input type="search" id="search-input" placeholder="Search by name, SATS number, admission number, parent name, or contact number" />
        <button type="submit" class="btn btn-secondary">Search</button>
      </form>

      <div class="breadcrumb" id="breadcrumb"></div>

      <div id="students-body">
        <div class="loading-row">Loading…</div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/students.js"></script>
</body>
</html>
