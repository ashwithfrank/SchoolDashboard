<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bus Detail — School Staff Management Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex; align-items:center;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <h1 id="page-title">Bus Detail</h1>
      </div>
    </header>

    <main class="content">
      <div class="breadcrumb"><a href="buses.html">Buses</a><span class="sep">/</span><span class="current" id="bus-heading">Loading…</span></div>

      <div id="detail-area">
        <div class="toolbar">
          <div></div>
          <a href="#" class="btn btn-secondary" id="edit-bus-link" style="display:none;">Edit Bus</a>
        </div>

        <div class="card" style="margin-bottom:20px;">
          <h3 style="margin-bottom:14px;">Bus Information</h3>
          <div id="bus-info"><div class="loading-row">Loading…</div></div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:14px;">Assigned Students</h3>
          <div id="roster-body"><div class="loading-row">Loading…</div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/bus-detail.js"></script>
</body>
</html>
