<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Academics — School Staff Management Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex; align-items:center;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <h1 id="page-title">Academics</h1>
      </div>
    </header>

    <main class="content">
      <div class="empty-state card">
        <div class="empty-icon">📘</div>
        <h2>Subjects, exams and marks are coming in Phase 5</h2>
        <p>Configure subjects per class, set an exam's min/max marks once, then record scores — percentage and
          PASS/FAIL are always calculated, never entered. Visible to Admin and Teaching Staff only.</p>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script>initShell();</script>
</body>
</html>
